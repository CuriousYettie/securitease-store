name: store-pipeline.yml
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
    contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. Fetch the code from the repository
      - name: Checkout Code
        uses: actions/checkout@v6

      # 2. Set up the specified JDK version (17) for the build
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. Optimize and configure Gradle for the build process
      - name: Set up Gradle
        uses: gradle/gradle-build-action@v3

      # 4. Make sure the wrapper script has execute permissions
      - name: Gradle execute permission for gradlew
        run: chmod +x gradlew

      # 5. Check formatting and run tests using Gradle
      - name: Check formatting and run tests
        run: ./gradlew spotlessCheck clean test

  docker:
    name: Build and Publish Docker Image
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write
    steps:
      # 1. Fetch the code from the repository
      - name: Checkout Code
        uses: actions/checkout@v6

      # 2. Set up Docker Buildx for building Docker images
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Set the image name based on the repository name
      - name: Set image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      # 4. Log in to GitHub Container Registry (GHCR) if the event is a push to the main branch
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 5. Build and publish Docker image
      - name: Build and publish Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.image.outputs.name }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}