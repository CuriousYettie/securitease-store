name: store-pipeline.yml
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
    contents: read
    packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. Fetch the code from the repository
      - name: Checkout Code
        uses: actions/checkout@v6

      # 2. Set up the specified JDK version (17) for the build
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. Optimize and configure Gradle for the build process
      - name: Set up Gradle
        uses: gradle/gradle-build-action@v3

      # 4. Make sure the wrapper script has execute permissions
      - name: Gradle execute permission for gradlew
        run: chmod +x gradlew

      # 5. Check formatting and run tests using Gradle
      - name: Check formatting and run tests
        run: ./gradlew spotlessCheck clean test